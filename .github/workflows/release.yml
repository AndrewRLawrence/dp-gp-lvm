name: Release

# This workflow builds the sdist and the wheel one time, checks them, and publishes the same files:
# - Each pull request: build and check only.
# - Each push to main: upload the dev build X.Y.Z.devN to TestPyPI.
# - Each tag vX.Y.Z: upload the release to PyPI, then make the GitHub release.
# PyPI and TestPyPI trust this file (Trusted Publishing) in the environments "pypi" and "testpypi". If you change the
# file name or an environment name, change the trusted publishers too. CONTRIBUTING.md gives the release steps.
# The workflow uses no cache, because a cache entry from another workflow could change a release build.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each action is pinned to a full commit SHA, with its version in a comment. A tag can move to new code; a SHA cannot.
# Dependabot updates the SHA and the comment together. See .github/dependabot.yml.
env:
  FORCE_COLOR: "1"
  MPLBACKEND: Agg
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  build:
    # The ruleset of main requires a check with this name.
    name: Build the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # The job reads the repository.
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The dev version counts the commits, and the tag check needs main.
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Check that the release tag is on main
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag $GITHUB_REF_NAME is not on main. Tag a commit of main."
            exit 1
          fi
      - name: Get the version
        id: version
        run: |
          # Each release tag is one argument, so the command substitution has no quotes.
          # shellcheck disable=SC2046
          uv run --no-project python scripts/ci/release.py version \
            --ref "$GITHUB_REF" --commits "$(git rev-list --count HEAD)" --tags $(git tag --list 'v*') > version.txt
          cat version.txt
          cat version.txt >> "$GITHUB_OUTPUT"
      - name: Set the version in pyproject.toml for this build only
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv version --frozen "$VERSION"
      - name: Build the sdist and the wheel
        run: uv build
      - name: Keep the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  check:
    name: Check the distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # The job reads the repository for the tests.
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Get the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the files in the distributions
        run: uv run --no-project python scripts/ci/release.py check-dist dist --version "$VERSION"
      - name: Check the metadata
        run: uv run --locked --only-group release twine check --strict dist/*
      - name: Install the wheel and the test dependencies
        run: |
          uv sync --locked --no-install-project
          uv pip install --no-deps dist/*.whl
          uv pip check
      - name: Check that Python imports the installed wheel
        run: |
          uv run --no-sync python - <<'EOF'
          import os
          from pathlib import Path

          import dp_gp_lvm

          path = Path(dp_gp_lvm.__file__)
          assert "site-packages" in path.parts, path
          assert dp_gp_lvm.__version__ == os.environ["VERSION"], dp_gp_lvm.__version__
          print(f"dp_gp_lvm {dp_gp_lvm.__version__} from {path.parent}")
          EOF
      - name: Run the fast tests against the installed wheel
        run: uv run --no-sync pytest -m "not slow and not experiments" -p no:cacheprovider

  testpypi:
    name: Publish the dev build to TestPyPI
    if: >-
      ${{ github.repository == 'AndrewRLawrence/dp-gp-lvm'
      && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [build, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/dp-gp-lvm/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing: OIDC gives a short-lived TestPyPI token, so there is no secret.
    steps:
      - name: Get the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Upload to TestPyPI with attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # Two runs of one commit make the same version.

  pypi:
    name: Publish the release to PyPI
    if: >-
      ${{ github.repository == 'AndrewRLawrence/dp-gp-lvm'
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi # The environment requires the approval of a maintainer.
      url: https://pypi.org/project/dp-gp-lvm/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing: OIDC gives a short-lived PyPI token, so there is no secret.
    steps:
      - name: Get the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Upload to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Make the GitHub release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # The job makes the release and attaches the distributions.
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Write the release notes from CHANGELOG.md
        run: python3 scripts/ci/release.py notes "$VERSION" > notes.md
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "dp-gp-lvm $VERSION" --notes-file notes.md "${flags[@]}"
